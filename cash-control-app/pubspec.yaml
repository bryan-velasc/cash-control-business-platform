name: cash_control

description: "CASH-CONTROL | Personal Finance App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.1

  shared_preferences: ^2.2.3

  connectivity_plus: ^6.1.0

  uuid: ^4.5.1

  home_widget: ^0.9.1

  hive: ^2.2.3

  hive_flutter: ^1.1.0

  fl_chart: ^0.68.0

  provider: ^6.1.2

  pdf: ^3.10.7

  printing: ^5.11.1

  google_fonts: ^6.2.1

  firebase_core: ^3.15.2

  firebase_auth: ^5.7.0

  google_sign_in: ^6.3.0

  excel: ^4.0.3

  file_saver: ^0.4.0

  google_mlkit_text_recognition: ^0.15.1

  image_picker: ^1.1.2

  url_launcher: ^6.3.0

  camera: ^0.11.0+2

  google_mlkit_face_detection: ^0.13.2

  permission_handler: ^12.0.0+1

  table_calendar: ^3.1.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/cash_control_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/cash_control_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/cash_control_logo.png"